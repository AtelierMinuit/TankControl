name: TankControl CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (macOS ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          brew install libusb

      - name: Build C Drivers & TankControl.app
        run: |
          make build

      - name: Verify Bundle Integrity & Self-Contained Libraries
        run: |
          codesign --verify --deep --strict "research/builds/audit-clean/night-20260904/TankControl.app"
          otool -L "research/builds/audit-clean/night-20260904/TankControl.app/Contents/Helpers/hp-smart-tank-tool"
          otool -L "research/builds/audit-clean/night-20260904/TankControl.app/Contents/Helpers/hp_scan"

      - name: Run Automated Test Suite (205 Tests)
        run: |
          make test
