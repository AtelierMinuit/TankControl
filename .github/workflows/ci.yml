name: TankControl Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Integrity (macOS ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependency
        run: brew install libusb

      - name: Build native drivers and TankControl.app
        run: make build

      - name: Verify bundle signature and architecture
        run: |
          APP="research/builds/audit-clean/night-20260904/TankControl.app"
          TOOL="$APP/Contents/Helpers/hp-smart-tank-tool"
          SCAN="$APP/Contents/Helpers/hp_scan"

          codesign --verify --deep --strict "$APP"
          file "$TOOL" | grep -q 'arm64'
          file "$SCAN" | grep -q 'arm64'
          otool -L "$TOOL" | grep -q '@rpath/libusb-1.0.0.dylib'
          otool -L "$SCAN" | grep -q '@rpath/libusb-1.0.0.dylib'

      - name: Run automated test suite
        run: python3 -m unittest discover -s tests

      - name: CI scope note
        run: |
          echo "Public CI validates reproducible build, bundle integrity, automated tests and ARM64 linkage."
