# Capacidades conservadoras del puente IPP Everywhere/AirPrint.
#
# Esta ficha describe lo que el puente de macOS puede aceptar y convertir al
# flujo PostScript de la cola local. No representa telemetria fisica del
# dispositivo. En particular, los niveles de tinta se publican como
# desconocidos (level=-2) y no se anuncia duplex ni borderless.

ATTR boolean           color-supported                         true
ATTR integer           copies-default                          1
ATTR rangeOfInteger    copies-supported                        1-1

ATTR keyword           media-default                           na_letter_8.5x11in
ATTR keyword           media-supported                         na_letter_8.5x11in,iso_a4_210x297mm,na_legal_8.5x14in,na_index-4x6_4x6in,na_5x7_5x7in
ATTR keyword           media-ready                             na_letter_8.5x11in
ATTR keyword           media-source-default                    main
ATTR keyword           media-source-supported                  main
ATTR keyword           media-type-default                      stationery
ATTR keyword           media-type-supported                    stationery,photographic-glossy,photographic-matte
ATTR integer           media-bottom-margin-supported           296
ATTR integer           media-left-margin-supported             296
ATTR integer           media-right-margin-supported            296
ATTR integer           media-top-margin-supported              296

ATTR collection media-size-supported
{
    MEMBER integer x-dimension 21590
    MEMBER integer y-dimension 27940
},
{
    MEMBER integer x-dimension 21000
    MEMBER integer y-dimension 29700
},
{
    MEMBER integer x-dimension 21590
    MEMBER integer y-dimension 35560
},
{
    MEMBER integer x-dimension 10160
    MEMBER integer y-dimension 15240
},
{
    MEMBER integer x-dimension 12700
    MEMBER integer y-dimension 17780
}

