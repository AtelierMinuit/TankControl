ATTR enum              orientation-requested-default           3
ATTR enum              orientation-requested-supported         3,4,5,6
ATTR enum              finishings-default                      3
ATTR enum              finishings-ready                        3
ATTR enum              finishings-supported                    3
ATTR collection finishings-col-default
{
    MEMBER keyword finishing-template none
}
ATTR collection finishings-col-ready
{
    MEMBER keyword finishing-template none
}
ATTR collection finishings-col-database
{
    MEMBER keyword finishing-template none
}
ATTR keyword           finishings-col-supported                finishing-template
ATTR keyword           output-bin-default                      face-down
ATTR keyword           output-bin-supported                    face-down
ATTR keyword           overrides-supported                     document-number,media,media-col,orientation-requested,pages
ATTR boolean           page-ranges-supported                   true
ATTR integer           pages-per-minute                        5
ATTR integer           pages-per-minute-color                  5
ATTR keyword           print-color-mode-default                color
ATTR keyword           print-color-mode-supported              color,monochrome
ATTR keyword           print-content-optimize-default          auto
ATTR keyword           print-content-optimize-supported        auto,text,graphic,photo,text-and-graphic
ATTR enum              print-quality-default                   4
ATTR enum              print-quality-supported                 3,4,5
ATTR keyword           print-rendering-intent-default          auto
ATTR keyword           print-rendering-intent-supported        auto,perceptual,relative,saturation
ATTR resolution        printer-resolution-default              600dpi
ATTR resolution        printer-resolution-supported            600dpi
ATTR keyword           sides-default                           one-sided
ATTR keyword           sides-supported                         one-sided

ATTR resolution        pwg-raster-document-resolution-supported 600dpi
ATTR keyword           pwg-raster-document-sheet-back          normal
ATTR keyword           pwg-raster-document-type-supported      sgray_8,srgb_8
ATTR keyword           urf-supported                           CP1,IS1-4-5,MT1-2-3-4-5,RS600,SRGB24,V1.4,W8

ATTR textWithoutLanguage printer-make-and-model                 "HP Smart Tank 500 series via macOS"
ATTR textWithoutLanguage printer-device-id                      "MFG:HP;MDL:smart tank 500 series;DES:macOS IPP bridge;CMD:PCL3GUI,LEDM;"
ATTR octetString       printer-input-tray                       "type=sheetFeedAutoNonRemovableTray;mediafeed=0;mediaxfeed=0;maxcapacity=-2;level=-2;status=0;name=main"

# RFC 3805/PWG supply values: -2 means unknown. Never expose CUPS simulator
# defaults as if they were readings from the physical printer.
ATTR octetString printer-supply "index=1;class=supplyThatIsConsumed;type=ink;unit=percent;maxcapacity=100;level=-2;colorantname=black;","index=2;class=supplyThatIsConsumed;type=ink;unit=percent;maxcapacity=100;level=-2;colorantname=cyan;","index=3;class=supplyThatIsConsumed;type=ink;unit=percent;maxcapacity=100;level=-2;colorantname=magenta;","index=4;class=supplyThatIsConsumed;type=ink;unit=percent;maxcapacity=100;level=-2;colorantname=yellow;"
ATTR textWithoutLanguage printer-supply-description "Black ink - device level unavailable","Cyan ink - device level unavailable","Magenta ink - device level unavailable","Yellow ink - device level unavailable"
