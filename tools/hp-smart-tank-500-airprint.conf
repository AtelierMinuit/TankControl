        MEMBER integer x-dimension 21590
        MEMBER integer y-dimension 27940
    }
    MEMBER keyword media-source main
    MEMBER keyword media-type stationery
    MEMBER integer media-bottom-margin 296
    MEMBER integer media-left-margin 296
    MEMBER integer media-right-margin 296
    MEMBER integer media-top-margin 296
